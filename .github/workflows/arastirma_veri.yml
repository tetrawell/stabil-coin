name: Arastirma verisi (Kripto Simulator)

# Kripto Simülatör araştırması için MEXC'den geçmiş mumları toplar. Telefon uygulamasıyla ilgisi yok.
# Sadece "arastirma" dalına itilince (ya da elle) çalışır; sonuç "arastirma-veri-sonuc" dalına konur.
on:
  push:
    branches: [arastirma]
    paths: [".github/workflows/arastirma_veri.yml", "arastirma/veri_topla.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parca: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: MEXC'den mum topla
        run: python3 arastirma/veri_topla.py "$RUNNER_TEMP/veri" ${{ matrix.parca }} 4
      - uses: actions/upload-artifact@v4
        with:
          name: veri-${{ matrix.parca }}
          path: ${{ runner.temp }}/veri
          retention-days: 3

  birlestir:
    needs: topla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/parcalar
      - name: Veriyi ayrı dala koy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/sonuc"
          for p in "$RUNNER_TEMP"/parcalar/veri-*; do cp -r "$p"/. "$RUNNER_TEMP/sonuc/"; done
          cd "$RUNNER_TEMP/sonuc"
          du -sh . ; find . -name "*.csv.gz" | wc -l
          git init -q -b arastirma-veri-sonuc
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "MEXC araştırma verisi $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" arastirma-veri-sonuc
