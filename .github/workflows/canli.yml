name: Gecici canli veri
# Geçici: MEXC canlı akış örnekleri (Kripto Al-Sat geliştirmesi için). Sonucu bu dala (sarkac-puani) koyar; iş bitince silinecek.
on:
  push:
    branches: [sarkac-puani]
    paths: [".github/gecici/canli.py"]
permissions:
  contents: write
jobs:
  kaydet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kayıt
        run: |
          pip install -q websockets==13.1
          python3 .github/gecici/canli.py
      - name: Dala koy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pi_veri
          git commit -q -m "Geçici: canlı veri örneği [skip ci]"
          git push -q origin HEAD:sarkac-puani
