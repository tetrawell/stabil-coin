name: Paketle

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - ".github/workflows/veri.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # İmza dosyası depoda şifreyle kilitli durur; şifre gizli kasada (IMZA_SIFRE).
      # Şifre yoksa sadece derleme kontrolü yapılır, indirilecek sürüm çıkarılmaz.
      - name: İmzayı hazırla
        env:
          IMZA_SIFRE: ${{ secrets.IMZA_SIFRE }}
        run: |
          if [ -n "$IMZA_SIFRE" ]; then
            echo "IMZA_DOSYASI=$GITHUB_WORKSPACE/imza/stabilcoin.p12" >> "$GITHUB_ENV"
            echo "IMZALI=1" >> "$GITHUB_ENV"
          else
            echo "::warning::IMZA_SIFRE yok; sadece derleme kontrolü yapılıyor, sürüm yayınlanmayacak."
          fi

      - name: APK oluştur
        env:
          IMZA_SIFRE: ${{ secrets.IMZA_SIFRE }}
          IMZA_ADI: stabilcoin
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Dosyaları adlandır
        if: env.IMZALI == '1'
        run: |
          cp app/build/outputs/apk/release/app-release.apk StabilCoin.apk
          cp app/build/outputs/apk/release/app-release.apk "StabilCoin-v1.0.${{ github.run_number }}.apk"

      - name: Sürümü yayınla
        if: env.IMZALI == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Stabil Coin v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            StabilCoin.apk
            StabilCoin-v1.0.${{ github.run_number }}.apk
