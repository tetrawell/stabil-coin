name: Gecici Al-Sat canli deneme
# Geçici: Kripto Al-Sat 0.9'un akış toplayıcısı gerçek MEXC'ye bağlanır, birkaç dakika toplar ve MEXC'nin kendi
# mumlarıyla karşılaştırılır. Sonuç bu dala (sarkac-puani) yazılır; iş bitince bu dosya ve .github/gecici silinecek.
on:
  push:
    branches: [sarkac-puani]
    paths: [".github/gecici/alsat/**"]
permissions:
  contents: write
jobs:
  canli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Canli deneme
        run: |
          mkdir -p pi_veri
          cd .github/gecici/alsat
          go test -tags canli -run TestCanliMexc -v -count=1 -timeout 15m . 2>&1 | tee ../../../pi_veri/alsat_canli.txt || true
      - name: Dala koy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pi_veri
          git commit -q -m "Geçici: Al-Sat canlı deneme sonucu [skip ci]"
          git push -q origin HEAD:sarkac-puani
