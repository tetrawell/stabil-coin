name: Kontrol

# main dışındaki dallarda: testleri çalıştırır ve uygulamanın derlendiğini kontrol eder.
# Sürüm yayınlamaz, telefondaki uygulamayı etkilemez.
on:
  push:
    branches-ignore: [main, gercek-veri]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testler
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Test özeti
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -o '<testsuite [^>]*>' "$f"
            grep -A3 '<failure' "$f" | head -40 || true
          done

      - name: Derleme kontrolü
        run: gradle :app:assembleDebug --no-daemon --stacktrace
