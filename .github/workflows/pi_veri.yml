name: Gecici Pi verisi
# Geçici: Pi'deki kumbaraların coinleri için mumlar, alış-satış defteri ve son işlemler (değerlendirme için).
# Veriyi bu dala (sarkac-puani) koyar. İş bitince bu dosya ve veri silinecek. Uygulamayı etkilemez.
on:
  push:
    branches: [sarkac-puani]
    paths: [".github/gecici/istek2.json"]
permissions:
  contents: write
jobs:
  veri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MEXC verisi
        run: |
          python3 - <<'PY'
          import json, urllib.request, time, gzip, os
          B = 'https://api.mexc.com/api/v3/'
          def get(p):
              err = None
              for i in range(4):
                  try:
                      return json.load(urllib.request.urlopen(B + p, timeout=30))
                  except Exception as e:
                      err = e; time.sleep(1 + i)
              return {'hata': str(err)[:200]}
          ist = json.load(open('.github/gecici/istek2.json'))
          now = int(time.time() * 1000)
          os.makedirs('pi_veri', exist_ok=True)
          V = {s: {'k1': [], 'k5': [], 'derin': [], 'bt': [], 'zaman': now} for s in ist['coins']}
          def mumlar(s, aralik, ms, bas):
              out, t = [], bas
              while t < now:
                  e = min(now, t + 500 * ms) - 1
                  r = get(f'klines?symbol={s}&interval={aralik}&startTime={t}&endTime={e}&limit=500')
                  if not isinstance(r, list):
                      out.append(['hata', r]); break
                  out += r; t = e + 1; time.sleep(0.12)
              return out
          for s in ist['coins']:
              V[s]['k1'] = mumlar(s, '1m', 60000, ist['bas1m'])
              V[s]['k5'] = mumlar(s, '5m', 300000, ist['bas5m'])
              V[s]['t24'] = get(f'ticker/24hr?symbol={s}')
              V[s]['islemler'] = get(f'trades?symbol={s}&limit=500')
              print(s, len(V[s]['k1']), len(V[s]['k5']), flush=True)
          for tur in range(4):
              for s in ist['coins']:
                  d = get(f'depth?symbol={s}&limit=500'); d['z'] = int(time.time() * 1000)
                  V[s]['derin'].append(d); V[s]['bt'].append(get(f'ticker/bookTicker?symbol={s}'))
                  time.sleep(0.1)
              if tur < 3: time.sleep(45)
          V['_bilgi'] = get('exchangeInfo?symbols=' + ','.join(ist['coins']))
          with gzip.open('pi_veri/veri.json.gz', 'wt') as f: json.dump(V, f)
          print('boyut', os.path.getsize('pi_veri/veri.json.gz'))
          PY
      - name: Dala koy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pi_veri
          git commit -q -m "Geçici: Pi değerlendirme verisi [skip ci]"
          git push -q origin HEAD:sarkac-puani
