name: Gecici fiyat
# Geçici: kumbaraların başlangıç anındaki fiyatları (değerlendirme için). İş bitince silinecek.
on:
  push:
    branches: [sarkac-puani]
    paths: [".github/gecici/istek.json"]
jobs:
  fiyat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fiyatlar
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          istek = json.load(open('.github/gecici/istek.json'))
          out = {}
          for s, t in istek:
              u = f"https://api.mexc.com/api/v3/klines?symbol={s}&interval=1m&startTime={t}&endTime={t+60000}&limit=1"
              try:
                  k = json.load(urllib.request.urlopen(u, timeout=20))
                  out[f"{s}|{t}"] = [k[0][0], float(k[0][1])] if k else None
              except Exception as e:
                  out[f"{s}|{t}"] = str(e)[:80]
              time.sleep(0.2)
          print("::notice title=fiyatlar::" + json.dumps(out))
          PY
